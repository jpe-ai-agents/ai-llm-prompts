name: CI Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  dify-render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1 # v3
      - name: Re-render Dify workflows and reject drift
        run: nix develop --command make check-dify
      - name: Test agent contracts
        run: nix develop --command python3 -m pytest -q agents/judges
  gate:
    permissions:
      actions: write
      contents: read
      pull-requests: read
    uses: JacobPEvans/.github/.github/workflows/_ci-gate.yml@v1
    with:
      profile: docs
      nix_validate: true
      token_limits: true
      # This flake's checks and packages are built per declared system
      # (aarch64-darwin, aarch64-linux, x86_64-linux) via `import nixpkgs
      # { system = ... }`, so each is tied to that system even though its
      # content (OKF frontmatter validation, catalog link-farms) doesn't vary
      # by platform. `nix flake check --all-systems` on a single-arch runner
      # tries to build every declared system's derivations for real and fails
      # with "platform mismatch" for the ones foreign to the runner - most
      # unrecoverably for aarch64-darwin, which a Linux runner can never
      # emulate. Disabled per `_nix-validate.yml`'s own documented `all_systems`
      # escape valve for this exact case.
      all_systems: false
      # Catalog text is instruction text: it is never low-risk and never tiny.
      low_risk_paths: 'docs/**'
      instruction_paths: 'AGENTS.md,**/AGENTS.md,**/prompts/**,**/skills/**,**/rules/**,agents/**,auto-ai-agent/**,automation/**,applications/**,developer-tools/**'
      guarded_paths: '.github/**,**/*secret*,**/*credential*,**/*token*,**/vault/**,*.sops.*,.sops.yaml'
      filters: |
        markdown:
          - '**.md'
          - 'auto-ai-agent/**'
          - '.markdownlint*'
        nix:
          - '**.nix'
          - 'flake.lock'
          - 'agents/**'
    secrets:
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
