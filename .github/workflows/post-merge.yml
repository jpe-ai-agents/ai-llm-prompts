# Settles deferred checks and moves the green pointer after each merge to main.
name: Post Merge

on:
  push:
    branches: [main]

permissions: {}

jobs:
  post-merge:
    permissions:
      contents: write
      pull-requests: write
      checks: read
      actions: read
    uses: JacobPEvans/.github/.github/workflows/_post-merge.yml@v1
    with:
      profile: docs
      filters: |
        markdown:
          - '**.md'
          - 'auto-ai-agent/**'
          - '.markdownlint*'
        nix:
          - '**.nix'
          - 'flake.lock'
          - 'agents/**'
    secrets:
      AUTOMATION_APP_PRIVATE_KEY: ${{ secrets.GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY }}
      slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
