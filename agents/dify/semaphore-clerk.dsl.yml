          title: Request and policy valid?
          type: if-else
        id: guard_gate
        position:
          x: 940
          "y": 500
        type: custom
      - data:
          cases:
            - case_id: propose
              conditions:
                - comparison_operator: is
                  id: operation-propose
                  value: propose
                  varType: string
                  variable_selector:
