      - data:
          code: |-
            import difflib
            import json
            import re

            def project_set(raw):
                parsed = json.loads(raw)
                if not isinstance(parsed, list):
                    raise ValueError("project policy must be a JSON array")
                values = {str(item).strip() for item in parsed}
                if "" in values:
                    raise ValueError("project policy is invalid")
                return values

            def output(allowed=False, reason="", **values):
                result = {"allowed": allowed, "reason": reason, "dispatch": False, "preview": "", "summary": "", "operation": "", "task_id": "", "project_id": "", "title": "", "description": "", "comment": "", "due_date": "", "priority": None, "done": None, "other_task_id": None, "relation_kind": ""}
                result.update(values)
                return result

            def preview_call(operation, **args):
                args = {key: value for key, value in args.items() if value is not None and value != ""}
                return json.dumps({"tool": "vikunja_tasks", "args": {"subcommand": operation, **args}}, separators=(",", ":"))

            # Task text is untrusted: a title or description can carry look-alike lines. Match whole lines only, take the ID
            # as the last token of a header line, and refuse a reply with more than one header or Project line.
            HEADER = re.compile(r"^(?:### )?\d+\. \*\*(.*)\*\* \(ID: (\d+)\)$", re.M)
            PROJECT = re.compile(r"^(?:- |   - )\*\*Project:\*\* (\d+)$", re.M)

            def task_scope(text):
                # One task read: JSON, or the server's markdown reply. Returns (task id, project id), or blanks when unsure.
                text = str(text or "")
                if text.lstrip().startswith(("{", "[")):
                    result = json.loads(text)
                    if isinstance(result, list):
                        result = result[0] if result else {}
                    if isinstance(result, dict) and isinstance(result.get("task"), dict):
                        result = result["task"]
                    if not isinstance(result, dict):
                        return "", ""
                    return str(result.get("id", result.get("taskId", ""))).strip(), str(result.get("projectId", result.get("project_id", ""))).strip()
                headers, projects = HEADER.findall(text), PROJECT.findall(text)
                if len(headers) != 1 or len(projects) != 1:
                    return "", ""
                return headers[0][1], projects[0]

            def open_tasks(text):
                # An open-task search: JSON, or markdown item header lines. Returns (id, title) rows; used only to refuse.
                text = str(text or "")
                if text.lstrip().startswith(("{", "[")):
                    items = json.loads(text)
                    items = items.get("tasks", []) if isinstance(items, dict) else items
                    return [(str(item.get("id", "")), str(item.get("title", ""))) for item in items if isinstance(item, dict)]
                return [(task_id, title) for title, task_id in HEADER.findall(text)]

            def same_title(first, second):
                first, second = (" ".join(re.findall(r"[a-z0-9]+", str(value).lower())) for value in (first, second))
                return bool(first) and difflib.SequenceMatcher(None, first, second).ratio() >= 0.9

            def strip_json_fence(text):
                # Remove one surrounding Markdown fence (```json or a bare ```) from model output. Only ASCII spaces, tabs, and
                # line breaks count as whitespace, so the JavaScript mirror trims the same characters. Text without a surrounding
                # fence is returned unchanged.
                value = str(text)
                stripped = value.strip(" \t\r\n")
                if len(stripped) >= 6 and stripped.startswith("```") and stripped.endswith("```"):
                    body = stripped[3:-3].strip(" \t\r\n")
                    if body[:4].lower() == "json":
                        body = body[4:].strip(" \t\r\n")
                    return body
                return value
            def main(intent_text: str, task_result: str, project_id_mandate: str, task_id_mandate: str, allowed_projects_raw: str, denied_projects_raw: str, mode_raw: str, other_task_result: str = "", plan: str = "") -> dict:
                try:
                    intent = json.loads(strip_json_fence(intent_text))
                    plan = json.loads(plan) if str(plan or "").strip() else {"operation": "update"}
                    operation = plan.get("operation")
                    mode = str(mode_raw or "").strip().lower()
                    if mode not in {"shadow", "live"}:
                        return output(reason="Write mode is missing or invalid; update refused.")
                    dispatch = mode == "live"
                    project_id_mandate = str(project_id_mandate or "").strip()
                    task_id = str(task_id_mandate or "").strip()
                    project_named = intent.get("project_named")
                    if not project_id_mandate and type(project_named) is not bool:
                        return output(reason="Project scope is missing or ambiguous; update refused.")
                    allowed = project_set(allowed_projects_raw)
                    denied = project_set(denied_projects_raw)

                    def out_of_scope(project_id, what):
                        if project_id in denied:
                            return f"The {what} project is denied; deny wins over allow."
                        if project_id not in allowed:
                            return f"The {what} project is unknown or outside the allowed policy."
                        return ""

                    if operation == "create":
                        reason = out_of_scope(str(plan.get("project_id", "")), "target")
                        if reason:
                            return output(reason=reason)
                        # A search row is not a verified read, so a match refuses and names the task; the caller comments there.
                        for match_id, match_title in open_tasks(task_result):
                            if same_title(match_title, plan.get("title", "")):
                                return output(reason=f"Open task {match_id} already has this title; the create is refused as a duplicate. Comment on task {match_id} instead.")
                        fields = {"project_id": str(plan["project_id"]), "title": str(plan["title"]), "description": str(plan.get("description", "")), "due_date": str(plan.get("due_date", "")), "priority": plan.get("priority"), "done": plan.get("done")}
                        preview = preview_call("create", projectId=fields["project_id"], title=fields["title"], description=fields["description"], dueDate=fields["due_date"], priority=fields["priority"], done=fields["done"])
                        return output(True, dispatch=dispatch, preview=preview, operation="create", summary=f"No open task has this title; creating it in project {fields['project_id']}.", **fields)
                    # The task read back must be the asked task, for update, comment and relate alike.
                    current_task_id, current_project_id = task_scope(task_result)
                    if not task_id or task_id != current_task_id or not current_project_id:
                        return output(reason="The current task scope could not be verified; update refused.")
                    reason = out_of_scope(current_project_id, "current task")
                    if reason:
                        return output(reason=reason)
                    if operation == "comment":
                        comment = str(plan.get("comment") or "")
                        if not comment.strip():
                            return output(reason="Comment text is required for comment.")
                        preview = preview_call("comment", id=task_id, comment=comment)
                        return output(True, dispatch=dispatch, preview=preview, operation="comment", task_id=task_id, comment=comment, summary=f"Comment on task {task_id}.")
                    if operation == "relate":
                        other = str(plan.get("other_task_id", ""))
                        other_id, other_project = task_scope(other_task_result)
                        if not other.isdigit() or other_id != other or not other_project:
                            return output(reason="The other task scope could not be verified; relate refused.")
                        reason = out_of_scope(other_project, "other task")
                        if reason:
                            return output(reason=reason)
                        preview = preview_call("relate", id=task_id, otherTaskId=int(other), relationKind="related")
                        return output(True, dispatch=dispatch, preview=preview, operation="relate", task_id=task_id, other_task_id=int(other), relation_kind="related", summary=f"Relate task {task_id} to task {other}.")
                    if operation != "update":
                        return output(reason="The operation is missing or unsupported.")
                    requested_project_id = project_id_mandate
                    if project_named and not requested_project_id:
                        return output(reason="The named project is unknown or unscoped; update refused.")
                    if requested_project_id:
                        reason = out_of_scope(requested_project_id, "requested")
                        if reason:
                            return output(reason=reason)
                        if requested_project_id != current_project_id:
                            return output(reason="A task update may not change its project.")
                    title = "" if intent.get("title") is None else str(intent["title"])
                    description = "" if intent.get("description") is None else str(intent["description"])
                    due_date = "" if intent.get("due_date") is None else str(intent["due_date"])
                    priority = intent.get("priority")
                    done = plan["done"] if "done" in plan else intent.get("done")
                    if priority is not None and (isinstance(priority, bool) or not isinstance(priority, (int, float))):
                        return output(reason="Priority must be a number; update refused.")
                    if done is not None and type(done) is not bool:
                        return output(reason="Done must be a boolean; update refused.")
                    if not any([title, description, due_date, priority is not None, done is not None]):
                        return output(reason="At least one task field is required for update.")
                    preview = preview_call("update", id=task_id, projectId=current_project_id, title=title, description=description, dueDate=due_date, priority=priority, done=done)
                    return output(True, dispatch=dispatch, preview=preview, operation="update", task_id=task_id, project_id=current_project_id, title=title, description=description, due_date=due_date, priority=priority, done=done, summary=f"Update task {task_id}.")
                except (TypeError, ValueError, KeyError, json.JSONDecodeError):
                    return output(reason="The current task or project policy could not be parsed safely; update refused.")
          code_language: python3
          desc: Check each write against the reads; a create matching an open task is refused and names that task.
          isInIteration: false
          isInLoop: false
          outputs:
            allowed:
              type: boolean
            comment:
              type: string
