      - data:
          code: |-
            import json,math,re,urllib.request
            from datetime import date,datetime,timezone
            from urllib.parse import urlsplit
            import re


            incident_markers = re.compile(
                r"\b(?:incidents?|outages?|down|breaches?|vulnerabilit(?:y|ies)|cve|exploits?|leaks?|"
                r"credentials?|secrets?|security|weakness(?:es)?|compromised|compromise|compromising)\b",
                re.IGNORECASE,
            )


            def marker_text(value):
                if isinstance(value, dict):
                    return " ".join(str(item) for item in value.values())
                if isinstance(value, (list, tuple)):
                    return " ".join(str(item) for item in value)
                return "" if value is None else str(value)


            def has_incident_marker(*values):
                return any(incident_markers.search(marker_text(value)) for value in values)
            # The urgency score of the work management standard. The standard owns the formula, the scales, the bands and the
            # test table; agents/judges/test_urgency_score.py pins that table. Change a number here only when the standard changes.
            _DUE_STEPS = ((0, 10), (2, 9), (7, 7), (14, 5), (30, 3))
            _PRIORITY_BANDS = ((12, 5), (7, 4), (4, 3), (2, 2))


            def time_criticality(days_left):
                # days_left is whole days until the due date, counted in UTC. None means no due date.
                if days_left is None:
                    return 1
                for limit, value in _DUE_STEPS:
                    if days_left <= limit:
                        return value
                return 1


            def urgency_score(value, risk, size, days_left=None, wont=False):
                # Returns None for an unscored item: a missing Value or Risk Reduction, or a Job Size of zero or less. That check
                # comes before the Won't rule, so a Won't item with a missing input stays unscored.
                for number in (value, risk, size):
                    if isinstance(number, bool) or not isinstance(number, (int, float)):
                        return None
                if size <= 0:
                    return None
                if wont:
                    return 0
                raw = (value + time_criticality(days_left) + risk) / size
                # Round a half up to two places, as JavaScript Math.round(x * 100) / 100 does; Python's round() rounds a half to
                # even. shortcut: correct for raw >= 0 only, upgrade if a negative Value or Risk Reduction is ever allowed.
                return int(raw * 100 + 0.5) / 100


            def priority_band(score):
                # The tracker's own priority, 0 to 5. None (unscored) is 0. A score of 0 (Won't) is 1.
                if score is None:
                    return 0
                for limit, band in _PRIORITY_BANDS:
                    if score >= limit:
                        return band
                return 1


            def label_number(labels, prefix):
                # The N of the first label "prefix:N" where N is a whole number in ASCII digits, else None.
                for label in labels or []:
                    text = str(label)
                    number = text[len(prefix) + 1:]
                    if text.startswith(prefix + ":") and number.isascii() and number.isdigit():
                        return int(number)
                return None
            def projects(raw):
                v=json.loads(raw)
                if not isinstance(v,list) or any(not str(x).strip() for x in v): raise ValueError()
                return {str(x).strip() for x in v}
            def grouping_result(results,refs,allowed,readonly,rank_only,denied,sync_error,pending_count):
                by_id={str(ref.get('id')):ref for ref in refs if isinstance(ref,dict) and ref.get('id') is not None}
                def visible(ref):
                    project=str(ref.get('project_id',''))
                    return not ref.get('done') and project not in denied and project in allowed|readonly
                def incident(ref):
                    return has_incident_marker(ref.get('title'),ref.get('description'),ref.get('category'),ref.get('categories'))
                pair_map={}; themes=[]; errors=[]; priority={'none':0,'related':1,'duplicate':2}
                if str(sync_error or '').strip(): errors.append(str(sync_error).strip())
                for entry in results or []:
                    try:
                        value=json.loads(entry) if isinstance(entry,str) else entry
                        if not isinstance(value,dict): continue
                        if value.get('error'): errors.append(str(value['error']))
                        current=by_id.get(str(value.get('id','')))
                        theme=' '.join(str(value.get('theme','')).split())
                        if current and visible(current) and not incident(current) and 2<=len(theme.split())<=5 and len(theme)<=80:
                            themes.append({'id':str(current['id']),'theme':theme})
                        for pair in value.get('pairs',[]) if isinstance(value.get('pairs'),list) else []:
                            if not isinstance(pair,dict) or pair.get('label') not in ('duplicate','related','none'): continue
                            task_id=str(pair.get('id','')); other_id=str(pair.get('other',''))
                            left=by_id.get(task_id); right=by_id.get(other_id); score=pair.get('score')
                            if not left or not right or task_id==other_id or isinstance(score,bool): continue
                            try: score=float(score)
                            except Exception: continue
                            if not math.isfinite(score) or not visible(left) or not visible(right) or incident(left) or incident(right): continue
                            key=tuple(sorted((task_id,other_id))); current=pair_map.get(key)
                            if current is None: pair_map[key]={'id':task_id,'other':other_id,'score':score,'label':pair['label']}
                            else:
                                current['score']=max(current['score'],score)
                                if priority[pair['label']]>priority[current['label']]: current['label']=pair['label']
                    except Exception: errors.append('a grouping result could not be read')
                pairs=list(pair_map.values())
                actions=[]
                for pair in pair_map.values():
                    left=by_id[pair['id']]; right=by_id[pair['other']]
                    ordered=sorted((left,right),key=lambda ref:(ref.get('task_index',0),str(ref.get('id',''))))
                    if pair['label']=='duplicate':
                        if not (left.get('has_subtasks') or left.get('is_epic') or right.get('has_subtasks') or right.get('is_epic')) and str(left.get('project_id')) in allowed and str(right.get('project_id')) in allowed and str(left.get('project_id')) not in rank_only and str(right.get('project_id')) not in rank_only:
                            actions.append({'kind':'close_duplicate','id':str(ordered[1]['id']),'of':str(ordered[0]['id']),'score':pair['score']})
                    elif pair['label']=='related':
                        actions.append({'kind':'relate','id':str(ordered[0]['id']),'other':str(ordered[1]['id']),'score':pair['score']})
                seen_themes=set()
                for theme in themes:
                    key=(theme['id'],theme['theme'])
                    if key not in seen_themes: seen_themes.add(key); actions.append({'kind':'theme',**theme})
                actions.sort(key=lambda action:(action['kind'],action['id'],action.get('other',action.get('of','')),action.get('theme','')))
                bounded=[]; duplicate_count=0
                for action in actions:
                    if action['kind']=='close_duplicate':
                        if duplicate_count>=5: continue
                        duplicate_count+=1
                    bounded.append(action)
                actions=bounded
                return {'pairs':pairs,'actions':actions,'error':'; '.join(sorted(set(errors))),'indexing_pending_batches':int(pending_count or 0)}
            def state_for(url,web_host,api_base,addr,role,secret,path,cache):
                if url in cache: return cache[url]
                p=urlsplit(url); m=re.fullmatch(r'/([^/]+)/([^/]+)/(pull|issues)/([1-9][0-9]*)/?',p.path)
                if p.scheme!='https' or p.netloc!=web_host or not m: return None
                auth=urllib.request.Request(addr.rstrip('/')+'/v1/auth/approle/login',data=json.dumps({'role_id':role,'secret_id':secret}).encode(),headers={'Content-Type':'application/json'},method='POST')
                with urllib.request.urlopen(auth,timeout=10) as r: login=json.loads(r.read())
                client=login.get('auth',{}).get('client_token','')
                req=urllib.request.Request(addr.rstrip('/')+'/v1/'+path.strip('/'),headers={'X-Vault-Token':client})
                with urllib.request.urlopen(req,timeout=10) as r: token_data=json.loads(r.read())
                data=token_data.get('data',{}); token=data.get('token') or data.get('data',{}).get('token')
                if not client or not token: raise ValueError('no read token')
                owner,repo,kind,num=m.groups(); endpoint='pulls' if kind=='pull' else 'issues'
                gh=urllib.request.Request(api_base.rstrip('/')+f'/repos/{owner}/{repo}/{endpoint}/{num}',headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'})
                try:
                    with urllib.request.urlopen(gh,timeout=10) as r: obj=json.loads(r.read())
                except urllib.error.HTTPError as error:
                    if error.code==404: return None
                    raise
                pr=obj.get('pull_request')
                merged=obj.get('merged') is True or bool(isinstance(pr,dict) and pr.get('merged_at'))
                value='merged' if merged else str(obj.get('state','')).lower()
                if (kind=='pull' or 'pull_request' in obj) and value=='closed': value='closed-unmerged'
                cache[url]=value if value in ('merged','closed','closed-unmerged','open') else None
                return cache[url]
            def strip_json_fence(text):
                # Remove one surrounding Markdown fence (```json or a bare ```) from model output. Only ASCII spaces, tabs, and
                # line breaks count as whitespace, so the JavaScript mirror trims the same characters. Text without a surrounding
                # fence is returned unchanged.
                value = str(text)
                stripped = value.strip(" \t\r\n")
                if len(stripped) >= 6 and stripped.startswith("```") and stripped.endswith("```"):
                    body = stripped[3:-3].strip(" \t\r\n")
                    if body[:4].lower() == "json":
                        body = body[4:].strip(" \t\r\n")
                    return body
                return value
            def main(model_text:str,refs_text:str,allowed_raw:str,readonly_raw:str,rank_raw:str,denied_raw:str,mode_raw:str,web_host:str,api_base:str,bao_addr:str,role_id:str,secret_id:str,token_path:str,prepare_error:str,grouping_results:list=None,grouping_error:str='',batch_error:str='',indexing_pending_count:int=0,today=None)->dict:
                actions=[]; seen=set(); mode=str(mode_raw or '').strip().lower()
                try:
                    allowed,readonly,rank_only,denied=map(projects,(allowed_raw,readonly_raw,rank_raw,denied_raw))
                    refs=json.loads(refs_text)
                    if rank_only-allowed or mode not in ('shadow','live'): raise ValueError()
                except Exception: return {'actions':[],'actions_json':'[]','grouping_json':json.dumps({'pairs':[],'actions':[],'error':'project policy or task refs are invalid','indexing_pending_batches':0}),'dispatch':False,'mode':'invalid','fetch_error':'project policy or task refs are invalid','unknown_label_count':0,'unknown_label_titles':[]}
                cache={}; failures=[]; proposed=[]
                try:
                    intent=json.loads(strip_json_fence(model_text))
                except Exception:
                    failures.append('model reply was not JSON')
                else:
                    proposed=intent.get('actions') if isinstance(intent,dict) else None
                    if not isinstance(proposed,list): proposed=[]; failures.append('model reply had the wrong shape')
                    elif not all(isinstance(item,dict) and type(item.get('task_index')) is int and item.get('kind') in ('rank','comment','done') for item in proposed): failures.append('model reply had an invalid action')
                allowed_operations={'apply-label', 'comment', 'list', 'update'}
                def add(ref,op,**fields):
                    if op not in allowed_operations: raise ValueError('Operation is not declared by this agent.')
                    key=(ref['id'],op,json.dumps(fields,sort_keys=True,ensure_ascii=False))
                    if key in seen:return
                    seen.add(key); actions.append({'operation':op,'id':ref['id'],'projectId':ref['project_id'],**fields})
                if today is None: today=datetime.now(timezone.utc).date()
                elif isinstance(today,datetime): today=today.astimezone(timezone.utc).date() if today.tzinfo else today.date()
                elif not isinstance(today,date): today=date.fromisoformat(str(today))
                def days_left(raw):
                    if raw is None or not str(raw).strip(): return None
                    value=str(raw).strip()
                    try:
                        if re.fullmatch(r'\d{4}-\d{2}-\d{2}',value): due=date.fromisoformat(value)
                        else:
                            parsed=datetime.fromisoformat(value[:-1]+'+00:00' if value.endswith('Z') else value)
                            due=parsed.astimezone(timezone.utc).date() if parsed.tzinfo else parsed.date()
                        return None if due==date.min else (due-today).days
                    except (TypeError,ValueError,OverflowError): return None
                def title_list(ref):
                    return [str(label.get('title','')) for label in ref.get('labels',[]) if isinstance(label,dict)]
                def slug_of(title):
                    match=re.fullmatch(r'epic:([a-z0-9]+(?:-[a-z0-9]+)*)',str(title).casefold())
                    return match.group(1) if match else None
                def has_kind(titles,prefix):
                    return any(str(title).casefold().startswith(prefix+':') for title in titles)
                def valid_size(title):
                    match=re.fullmatch(r'size:([0-9]+)',str(title).casefold())
                    size=int(match.group(1)) if match else None
                    return size if size in (1,2,3,5,8,13) else None
                def wont(titles):
                    return any(str(title).replace('’',"'").casefold()=="won't" for title in titles)
                label_ids={}; unknown_titles=[]
                for ref in refs:
                    for label in ref.get('labels',[]) if isinstance(ref.get('labels'),list) else []:
                        if not isinstance(label,dict) or not isinstance(label.get('title'),str): continue
                        raw_id=label.get('id')
                        if type(raw_id) is int and raw_id>0: label_ids.setdefault(label['title'],raw_id)
                        elif isinstance(raw_id,str) and raw_id.isascii() and raw_id.isdigit() and int(raw_id)>0: label_ids.setdefault(label['title'],int(raw_id))
                epic_cards={}; ambiguous_epics=set()
                for ref in refs:
                    titles=title_list(ref); folded={title.casefold() for title in titles}
                    if 'epic' not in folded: continue
                    for title in titles:
                        slug=slug_of(title)
                        if not slug: continue
                        if slug in epic_cards and epic_cards[slug] is not ref: ambiguous_epics.add(slug)
                        else: epic_cards[slug]=ref
                epic_cards={slug:ref for slug,ref in epic_cards.items() if slug not in ambiguous_epics}
                unknown_seen=set()
                for ref in refs:
                    project=ref['project_id']
                    if project in denied or project not in allowed|readonly: continue
                    text=(str(ref.get('title',''))+' '+str(ref.get('description','')))
                    if has_incident_marker(ref.get('title'),ref.get('description'),ref.get('category'),ref.get('categories')):
                        if project in allowed and project not in rank_only: add(ref,'comment',comment='This item belongs in Zammad.')
                        continue
                    rank_items=[item for item in proposed if isinstance(item,dict) and type(item.get('task_index')) is int and item['task_index']==ref['task_index'] and item.get('kind')=='rank'] if isinstance(proposed,list) else []
                    protected=ref.get('has_subtasks') or ref.get('is_epic')
                    # Every eligible task is scored, mentioned by the model or not, so priority means one thing.
                    if project in allowed and not protected:
                        titles=title_list(ref); additions=[]; proposed_epic=False; proposed_size=False
                        for item in rank_items:
                            labels=item.get('labels')
                            if not isinstance(labels,list): continue
                            for proposal in labels:
                                if not isinstance(proposal,str): continue
                                slug=slug_of(proposal)
                                if slug and not proposed_epic and not has_kind(titles,'epic') and slug in epic_cards:
                                    proposed_epic=True
                                    additions.append('epic:'+slug)
                                size=valid_size(proposal)
                                if size is not None and not proposed_size:
                                    proposed_size=True
                                    if not has_kind(titles,'size'): additions.append('size:'+str(size))
                        future_titles=titles[:]
                        for title in additions:
                            label_id=label_ids.get(title)
                            if label_id is None:
                                if title not in unknown_seen: unknown_seen.add(title); unknown_titles.append(title)
                            else: future_titles.append(title)
                        epic_slugs=[]
                        for title in future_titles:
                            slug=slug_of(title)
                            if slug: epic_slugs.append(slug)
                        score=None; size_numbers=[valid_size(title) for title in future_titles]
                        size_numbers=[size for size in size_numbers if size is not None]
                        if len(epic_slugs)==1 and len(size_numbers)==1 and epic_slugs[0] in epic_cards:
                            card_titles=title_list(epic_cards[epic_slugs[0]])
                            value=label_number(card_titles,'value'); risk=label_number(card_titles,'risk')
                            if value is not None and not 1<=value<=10: value=None
                            if risk is not None and not 1<=risk<=10: risk=None
                            score=urgency_score(value,risk,size_numbers[0],days_left(ref.get('due_date')),wont(titles) or wont(card_titles))
                        priority=priority_band(score)
                        if (ref.get('priority') or 0)!=priority: add(ref,'update',priority=priority)
                        label_ids_to_add=[label_ids[title] for title in additions if title in label_ids]
                        if label_ids_to_add: add(ref,'apply-label',labels=label_ids_to_add)
                    for item in proposed if isinstance(proposed,list) else []:
                        if not isinstance(item,dict) or type(item.get('task_index')) is not int or item['task_index']!=ref['task_index']: continue
                        kind=item.get('kind')
                        protected=ref.get('has_subtasks') or ref.get('is_epic')
                        if kind in ('comment','done') and project in allowed and project not in rank_only:
                            if kind=='done' and protected: continue
                            urls=re.findall(r'https://[^\s<>"\']+',text)
                            for raw_url in urls:
                                url=raw_url.rstrip('.,);]')
                                try: state=state_for(url,web_host,api_base,bao_addr,role_id,secret_id,token_path,cache)
                                except Exception: failures.append('a GitHub state check failed'); continue
                                if state is None: continue
                                if kind=='comment':
                                    add(ref,'comment',comment=f'Linked GitHub work: {url} (state: {state}).')
                                    break
                                if kind=='done' and state in ('merged','closed') and not ref.get('done'):
                                    add(ref,'update',done=True); break
                grouped=grouping_result(grouping_results,refs,allowed,readonly,rank_only,denied,grouping_error,indexing_pending_count)
                fetch_errors=[str(value or '').strip() for value in (prepare_error,batch_error) if str(value or '').strip()]
                return {'actions':actions,'actions_json':json.dumps(actions,ensure_ascii=False),'grouping_json':json.dumps(grouped,ensure_ascii=False),'dispatch':mode=='live','mode':mode,'fetch_error':'; '.join(sorted(set(fetch_errors+failures))),'unknown_label_count':len(unknown_titles),'unknown_label_titles':unknown_titles}
          code_language: python3
