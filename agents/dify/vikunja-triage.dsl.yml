      - data:
          code: |-
            import concurrent.futures,json,math,time,urllib.parse,urllib.request
            from urllib.parse import urlsplit
            class NoRedirect(urllib.request.HTTPRedirectHandler):
                def redirect_request(self,req,fp,code,msg,headers,newurl): return None
            def entity_identity(item):
                return (str(item.get('id') or ''),str(item.get('name') or '')) if isinstance(item,dict) else ('','')
            def score_value(record,floor):
                value=record.get('score') if isinstance(record,dict) else None
                try: score=float(value)
                except Exception: return None
                return score if not isinstance(value,bool) and math.isfinite(score) and score>=floor else None
            def main(api_base,api_key,dataset_name,provider,model,batch_refs,selected_group_refs=None,all_group_refs=None,score_floor_raw='0.86',top_k_raw='5'):
                refs=[ref for ref in (batch_refs or []) if isinstance(ref,dict)]
                safe_refs=[ref for ref in (selected_group_refs if selected_group_refs is not None else refs) if isinstance(ref,dict)]
                all_refs=[ref for ref in (all_group_refs if all_group_refs is not None else safe_refs) if isinstance(ref,dict)]
                empty={'group_refs':[],'group_inputs':[],'theme_inputs':[],'grouping_error':'','pending_count':0}
                if not refs: return empty
                if not str(api_base or '').strip() or not str(api_key or '').strip():
                    empty['grouping_error']='Dify Dataset API is not configured'; return empty
                name=str(dataset_name or '').strip()
                if not name:
                    empty['grouping_error']='TRIAGE_DATASET_NAME is empty'; return empty
                try:
                    parts=urlsplit(str(api_base).strip())
                    if parts.scheme not in ('http','https') or not parts.netloc or parts.username or parts.password or parts.query or parts.fragment or not parts.path.rstrip('/').endswith('/v1'):
                        raise ValueError('invalid Dify Service API base')
                    base=parts.geturl().rstrip('/')
                    opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect())
                    def request_json(method,path,query=None,payload=None):
                        url=base+path+('?'+urllib.parse.urlencode(query) if query else '')
                        body=None if payload is None else json.dumps(payload,ensure_ascii=False).encode()
                        headers={'Authorization':'Bearer '+str(api_key),'Accept':'application/json'}
                        if body is not None: headers['Content-Type']='application/json'
                        req=urllib.request.Request(url,data=body,headers=headers,method=method)
                        try:
                            with opener.open(req,timeout=2) as response: return json.loads(response.read())
                        except Exception: raise ValueError('Dify Dataset API request failed') from None
                    def pages(path,keyword):
                        page=1
                        while True:
                            result=request_json('GET',path,{'page':page,'limit':100,'keyword':keyword})
                            rows=result.get('data') if isinstance(result,dict) else None
                            if not isinstance(rows,list): raise ValueError('Dify Dataset API returned an invalid list')
                            yield from rows
                            if not result.get('has_more'): break
                            page+=1
                    dataset_id=''
                    for candidate in pages('/datasets',name):
                        candidate_id,candidate_name=entity_identity(candidate)
                        if candidate_name==name and candidate_id:
                            dataset_id=candidate_id; break
                    if not dataset_id:
                        if not str(provider or '').strip() or not str(model or '').strip():
                            empty['grouping_error']='Embedding provider and model are required to create the grouping dataset'; return empty
                        created=request_json('POST','/datasets',payload={'name':name,'indexing_technique':'high_quality','embedding_model_provider':str(provider).strip(),'embedding_model':str(model).strip()})
                        dataset_id,dataset_name_returned=entity_identity(created)
                        if not dataset_id or dataset_name_returned!=name: raise ValueError('Dify Dataset API returned an invalid dataset')
                    batches=[]; failures=[]
                    for ref in refs:
                        task_id=str(ref.get('id',''))
