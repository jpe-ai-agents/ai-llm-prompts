      - data:
          code: |-
            import json
            def id_key(ref):
                value=str(ref.get('id',''))
                return (0,int(value)) if value.isdigit() else (1,value)
            def cursor(refs,timestamp,size_raw):
                size=int(size_raw)
                if size<1: raise ValueError('invalid batch size')
                ordered=sorted(refs,key=id_key)
                count=(len(ordered)+size-1)//size
                if not count: return ordered,0,0,size
                index=(int(float(timestamp))//600)%count
                return ordered[index*size:(index+1)*size],index,count,size
            def main(refs_text:str,model_tasks_text:str,timestamp:str,size_raw:str)->dict:
                try:
                    refs=json.loads(refs_text)
                    if not isinstance(refs,list): raise ValueError()
                    selected,index,count,size=cursor(refs,timestamp,size_raw)
                    selected_indices={ref['task_index'] for ref in selected}
                    model=json.loads(model_tasks_text)
                    if not isinstance(model,dict) or not isinstance(model.get('tasks'),list): raise ValueError()
                    safe_by_index={task.get('task_index'):task for task in model['tasks'] if isinstance(task,dict)}
                    def safe_ref(ref):
                        safe=dict(ref); task=safe_by_index.get(ref.get('task_index'),{})
                        safe.update({'title':str(task.get('title','')),'description':str(task.get('description',''))})
                        return safe
                    visible=[task for task in model['tasks'] if task.get('task_index') in selected_indices]
                    context=dict(model)
                    context.update({'batch_index':index,'batch_count':count,'batch_size':size,'tasks':visible})
                    return {'batch_refs':selected,'selected_group_refs':[safe_ref(ref) for ref in selected],'all_group_refs':[safe_ref(ref) for ref in refs],'model_tasks':json.dumps(context,ensure_ascii=False),'batch_index':index,'batch_count':count,'batch_size':size,'batch_error':''}
                except Exception:
                    return {'batch_refs':[],'selected_group_refs':[],'all_group_refs':[],'model_tasks':'{"tasks":[]}','batch_index':0,'batch_count':0,'batch_size':0,'batch_error':'batch cursor could not be computed'}
          code_language: python3
          outputs:
            all_group_refs:
              children: null
              type: array[object]
            batch_count:
              type: number
            batch_error:
              children: null
              type: string
            batch_index:
              type: number
            batch_refs:
              children: null
              type: array[object]
            batch_size:
              type: number
            model_tasks:
              children: null
              type: string
            selected_group_refs:
              children: null
              type: array[object]
          selected: false
          title: Select task batch
          type: code
          variables:
            - value_selector:
                - prepare
                - task_refs
              variable: refs_text
            - value_selector:
                - prepare
                - model_tasks
              variable: model_tasks_text
            - value_selector:
                - sys
                - timestamp
              variable: timestamp
            - value_selector:
                - env
                - GROUPING_BATCH_SIZE
              variable: size_raw
        height: 54
        id: batch
        position:
          x: 1550
          "y": 170
        positionAbsolute:
