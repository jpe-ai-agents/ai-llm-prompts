                  if not matches or any(type(task.get("id")) is not int or task.get("id") <= 0 for task in matches):
                      return {"route": "terminate", "status": "stop", "reason": "confirmation-readback-incomplete", "result": result(template_name, parameter_set, proposal_id, run_id, "unknown")}
                  winner = min(matches, key=lambda task: task["id"])
                  if winner["id"] != run_id:
                      return {"route": "duplicate", "status": "refused", "reason": "duplicate-confirm", "result": {"operation": "confirm", "template_name": template_name, "parameter_set": parameter_set, "proposal_id": proposal_id, "run_id": run_id, "state": "duplicate-confirm", "winning_run_id": winner["id"]}}
