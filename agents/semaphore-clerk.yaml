              def main(template_name: str, parameter_set: str, proposal_id, run_id, run_state: str, confirm_message: str, filter_text: str, filter_json=None) -> dict:
                  value = decode(filter_text, filter_json)
                  tasks = value.get("tasks") if isinstance(value, dict) else None
