            hint: Immutable caller-supplied task scope for updates.
            placeholder: ''
        height: 54
        id: start
        position: {x: 40, y: 280}
        positionAbsolute: {x: 40, y: 280}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          context:
            enabled: false
            variable_selector: []
          desc: Convert the caller request to structured intent only. This node has no tools.
          memory:
            query_prompt_template: '{{#sys.query#}}'
            role_prefix: {assistant: '', user: ''}
            window: {enabled: false, size: 50}
          model:
            completion_params: {temperature: 0}
            mode: chat
            name: __DIFY_LITELLM_ROLE__
            provider: langgenius/openai_api_compatible/openai_api_compatible
          prompt_template:
          - {id: system-prompt, role: system, text: __DIFY_SYSTEM_PROMPT__}
          - {id: user-prompt, role: user, text: '{{#sys.query#}}'}
          prompt_config:
            jinja2_variables: []
          selected: false
          title: Parse request
          type: llm
          vision: {enabled: false}
        height: 220
        id: intent
        position: {x: 340, y: 280}
        positionAbsolute: {x: 340, y: 280}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          desc: Read-only project list; the Code guard resolves a named project to its ID from this reply.
          is_team_authorization: false
          provider_id: VIKUNJA_MCP_PROVIDER_ID
          provider_name: __DIFY_MCP_SERVER__
          provider_type: mcp
          selected: false
          title: vikunja_projects list
          type: tool
          tool_configurations: {}
          tool_label: vikunja_projects
          tool_name: vikunja_projects
          tool_parameters:
            subcommand: {type: constant, value: list}
            perPage: {type: constant, value: 50}
        height: 100
        id: projects-tool
        position: {x: 490, y: 120}
        positionAbsolute: {x: 490, y: 120}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          code: |-
            import json
            import re
            __DIFY_HELPER_INCIDENT_CLASSIFIER__

            def project_set(raw):
                parsed = json.loads(raw)
                if not isinstance(parsed, list):
                    raise ValueError("project policy must be a JSON array")
                values = {str(item).strip() for item in parsed}
                if "" in values:
                    raise ValueError("project policy is invalid")
                return values

            def project_ids(text):
                # shortcut: one page of up to 50 projects; a name past it resolves to the inbox. Search by name if projects outgrow it.
                # Item lines only: "N. **Title** (ID: n)" from the start of a line; the ID is the last token on that line.
                return {title.strip().lower(): pid for title, pid in re.findall(r"^\d+\. \*\*(.*)\*\* \(ID: (\d+)\)$", str(text or ""), re.M)}

            def output(allowed=False, reason="", **values):
                result = {
                    "allowed": allowed,
                    "reason": reason,
                    "dispatch": False,
                    "preview": "",
                    "needs_update_check": False,
                    "needs_write_check": False,
                    "operation": "",
                    "read_operation": "",
                    "read_search": "",
                    "read_done": None,
                    "task_id": "",
                    "other_task_id": None,
                    "other_read_task_id": "",
                    "project_id": "",
                    "requested_project_id": "",
                    "title": "",
                    "description": "",
                    "comment": "",
                    "due_date": "",
                    "priority": None,
                    "done": None,
                    "filter": "",
                    "search": "",
                    "plan": "",
                }
                result.update(values)
                if not result["read_operation"] and result["operation"] in {"list", "get"}:
                    result["read_operation"] = result["operation"]
                    result["read_search"] = result["search"]
                    result["read_done"] = result["done"]
                result["other_read_task_id"] = result["other_read_task_id"] or result["task_id"]
                return result

            def plan_of(operation, **fields):
                return json.dumps({"operation": operation, **{key: value for key, value in fields.items() if value is not None and value != ""}}, separators=(",", ":"))

            def preview_call(operation, **args):
                args = {key: value for key, value in args.items() if value is not None and value != ""}
                return json.dumps({"tool": "__DIFY_TOOL_NAME__", "args": {"subcommand": operation, **args}}, separators=(",", ":"))

            __DIFY_HELPER_JSON_FENCE__
            def main(intent_text: str, project_id_mandate: str, task_id_mandate: str, allowed_projects_raw: str, denied_projects_raw: str, inbox_project_id: str, mode_raw: str, projects_text: str = "") -> dict:
                try:
                    intent = json.loads(strip_json_fence(intent_text))
                    if not isinstance(intent, dict) or intent.get("route") != "vikunja":
                        return output(reason="Refused; file this in Zammad.")
                    title = "" if intent.get("title") is None else str(intent["title"])
                    description = "" if intent.get("description") is None else str(intent["description"])
                    comment = "" if intent.get("comment") is None else str(intent["comment"])
                    if has_incident_marker(title, description, comment, intent.get("category"), intent.get("categories")):
                        return output(reason="Refused; file this in Zammad.")
                    operation = intent.get("operation")
                    done = intent.get("done")
                    if operation in {"close", "reopen"}:
                        operation, done = "update", operation == "close"
                    if operation not in __DIFY_TOOL_OPERATIONS__:
                        return output(reason="The operation is missing or unsupported.")
                    mode = str(mode_raw or "").strip().lower()
                    if operation in {"create", "update", "comment", "relate"} and mode not in {"shadow", "live"}:
                        return output(reason="Write mode is missing or invalid; writes are refused.")
                    project_id_mandate = str(project_id_mandate or "").strip()
                    task_id_mandate = str(task_id_mandate or "").strip()
                    asked_task_id = "" if intent.get("task_id") is None else str(intent["task_id"]).strip()
                    if operation in {"update", "comment", "relate"} and task_id_mandate and asked_task_id and asked_task_id != task_id_mandate:
                        return output(reason="The asked task does not match the structured task_id.")
                    due_date = "" if intent.get("due_date") is None else str(intent["due_date"])
                    priority = intent.get("priority")
                    if priority is not None and (isinstance(priority, bool) or not isinstance(priority, (int, float))):
                        return output(reason="Priority must be a number.")
                    if done is not None and type(done) is not bool:
                        return output(reason="Done must be a boolean.")
                    filter_value = "" if intent.get("filter") is None else str(intent["filter"])
                    search = "" if intent.get("search") is None else str(intent["search"])
                    if operation == "list":
                        return output(True, operation="list", dispatch=True, done=done, filter=filter_value, search=search)
                    if operation == "get":
                        task_id = "" if intent.get("task_id") is None else str(intent["task_id"]).strip()
                        if not task_id:
                            return output(reason="A task reference is required for get.")
                        return output(True, operation="get", dispatch=True, task_id=task_id)
                    project_named = intent.get("project_named")
                    if not project_id_mandate and type(project_named) is not bool:
                        return output(reason="Project scope is missing or ambiguous.")
                    try:
                        allowed = project_set(allowed_projects_raw)
                        denied = project_set(denied_projects_raw)
                    except (TypeError, ValueError, json.JSONDecodeError):
                        return output(reason="Project policies are missing or invalid; writes are refused.")
                    if operation == "create":
                        if not title.strip():
                            return output(reason="A task title is required for create.")
                        project_name = "" if intent.get("project") is None else str(intent["project"]).strip().lower()
                        project_id = project_id_mandate or (project_ids(projects_text).get(project_name, "") if project_named else "")
                        if not project_id:
                            # An unresolved or absent project name files to the inbox.
                            project_id = str(inbox_project_id or "").strip()
                            if not project_id:
                                return output(reason="The inbox project policy is missing; the create is refused.")
                        if project_id in denied:
                            return output(reason="The target project is denied; deny wins over allow.")
                        if project_id not in allowed:
                            return output(reason="The target project is unknown or outside the allowed policy.")
                        preview = preview_call("create", projectId=project_id, title=title, description=description, dueDate=due_date, priority=priority, done=done)
                        plan = plan_of("create", project_id=project_id, title=title, description=description, due_date=due_date, priority=priority, done=done)
                        # Search open tasks for the title before any create; the write guard decides on the result.
                        return output(True, operation="create", dispatch=mode == "live", needs_write_check=True, read_operation="list", read_search=title, read_done=False, preview=preview, plan=plan, project_id=project_id, title=title, description=description, due_date=due_date, priority=priority, done=done)
                    task_id = task_id_mandate or asked_task_id
                    if operation in {"comment", "relate"}:
                        if not task_id:
                            return output(reason=f"A task reference is required for {operation}.")
                        if operation == "comment":
                            text = comment or description
                            if not text.strip():
                                return output(reason="Comment text is required for comment.")
                            plan = plan_of("comment", task_id=task_id, comment=text)
                            return output(True, operation="get", dispatch=True, needs_update_check=True, needs_write_check=True, read_operation="get", task_id=task_id, comment=text, plan=plan)
                        other = "" if intent.get("other_task_id") is None else str(intent["other_task_id"]).strip()
                        if not other.isdigit() or not task_id.isdigit() or other == task_id:
                            return output(reason="Relate needs two different numeric task references.")
                        plan = plan_of("relate", task_id=task_id, other_task_id=int(other))
                        return output(True, operation="get", dispatch=True, needs_update_check=True, needs_write_check=True, read_operation="get", task_id=task_id, other_task_id=int(other), other_read_task_id=other, plan=plan)
                    if not task_id:
                        return output(reason="A task reference is required for update.")
                    requested_project_id = project_id_mandate
                    if project_named and not requested_project_id:
                        return output(reason="The named project is unknown or unscoped.")
                    if requested_project_id:
                        if requested_project_id in denied:
                            return output(reason="The requested project is denied; deny wins over allow.")
                        if requested_project_id not in allowed:
                            return output(reason="The requested project is unknown or outside the allowed policy.")
                    if not any([title, description, due_date, priority is not None, done is not None]):
                        return output(reason="At least one task field is required for update.")
                    plan = plan_of("update", task_id=task_id, done=done)
                    return output(True, operation="get", dispatch=True, needs_update_check=True, needs_write_check=True, read_operation="get", plan=plan, task_id=task_id, requested_project_id=requested_project_id, title=title, description=description, due_date=due_date, priority=priority, done=done)
                except (TypeError, ValueError, json.JSONDecodeError):
                    return output(reason="The request could not be parsed safely; file this in Zammad.")
          code_language: python3
          desc: Validate the operation and write scope before every task call; plan the read that each write checks first.
          isInIteration: false
          isInLoop: false
          outputs:
            allowed: {type: boolean}
            reason: {type: string}
            dispatch: {type: boolean}
            preview: {type: string}
            needs_update_check: {type: boolean}
            needs_write_check: {type: boolean}
            operation: {type: string}
            read_operation: {type: string}
            read_search: {type: string}
            read_done: {type: boolean}
            task_id: {type: string}
            other_task_id: {type: number}
            other_read_task_id: {type: string}
            project_id: {type: string}
            requested_project_id: {type: string}
            title: {type: string}
            description: {type: string}
            comment: {type: string}
            due_date: {type: string}
            priority: {type: number}
            done: {type: boolean}
            filter: {type: string}
            search: {type: string}
            plan: {type: string}
          selected: false
          title: Code guard
          type: code
          variables:
          - variable: intent_text
            value_selector: [intent, text]
          - variable: project_id_mandate
            value_selector: [start, project_id]
          - variable: task_id_mandate
            value_selector: [start, task_id]
          - variable: allowed_projects_raw
            value_selector: [env, VIKUNJA_ALLOWED_PROJECTS]
          - variable: denied_projects_raw
            value_selector: [env, VIKUNJA_DENIED_PROJECTS]
          - variable: inbox_project_id
            value_selector: [env, VIKUNJA_INBOX_PROJECT_ID]
          - variable: mode_raw
            value_selector: [env, VIKUNJA_MODE]
          - variable: projects_text
            value_selector: [projects-tool, text]
        height: 54
        id: guard
        position: {x: 640, y: 280}
        positionAbsolute: {x: 640, y: 280}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          cases:
          - case_id: guard-allowed
            conditions:
            - comparison_operator: is
              id: guard-allowed-condition
              value: true
              varType: boolean
              variable_selector: [guard, allowed]
            id: guard-allowed
            logical_operator: and
          desc: A refused request terminates here without a task call.
          selected: false
          title: Guard passed?
          type: if-else
        height: 120
        id: guard-gate
        position: {x: 940, y: 280}
        positionAbsolute: {x: 940, y: 280}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          desc: Read-only. Runs the read the Code guard planned; writes never dispatch from this node.
          is_team_authorization: false
          provider_id: VIKUNJA_MCP_PROVIDER_ID
          provider_name: __DIFY_MCP_SERVER__
          provider_type: mcp
          selected: false
          title: __DIFY_TOOL_NAME__
