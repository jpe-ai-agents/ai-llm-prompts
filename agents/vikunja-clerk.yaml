name: vikunja-clerk
extends: connector
description: |
  Use when: a plain-words task request needs a find, file, update, comment, relate, close, or reopen.
  Do not use when: the request concerns incidents, deletion, or unsupported operations.
owns: vikunja
reader: requesting operator
acted_signal: verified task receipt or actionable blocked result
procedure:
  - {repo: dryvist/claude-code-plugins, path: ai-cli-harness-better-practices/skills/track-followups/SKILL.md}
tools:
  # vikunja_tasks is the primary tool; every write is guarded before dispatch.
  - vikunja_tasks.list
  - vikunja_tasks.get
  - vikunja_tasks.create
  - vikunja_tasks.update
  - vikunja_tasks.comment
  - vikunja_tasks.relate
  # Read-only project lookup: project names resolve to IDs at run time.
  - vikunja_projects.list
mcp_servers: [vikunja]
mandate_binding:
  write_tools: [vikunja_tasks.create, vikunja_tasks.update, vikunja_tasks.comment, vikunja_tasks.relate]
  from_fields: [caller, operation, project_id, task_id, other_task_id, title, description, comment, due_date, priority, done]
  source: structured_fields_or_caller_ask
  immutable: true
mcp_access: {vikunja: own_litellm_key_only}
identity: agent-vikunja-clerk
api_key_ref: openbao://agent-key/vikunja-clerk
guards:
  vikunja:
    tool_allowlist: [vikunja_tasks, vikunja_projects]
    tool_allowlist_enforced_in_code: true
    operation_allowlist:
      vikunja_tasks: [list, get, create, update, comment, relate]
      vikunja_projects: [list]
    operation_allowlist_enforced_in_code: true
    # close and reopen are updates that set done; relate uses relationKind related only.
    operation_aliases: {close: update, reopen: update}
    deny_operations:
      - delete
      - bulk-*
      - move
      - move-*
      - move-to-project
      - project-move
      - project-move-*
      - label
      - apply-label
      - remove-label
      - assign
      - unassign
      - bulk-create
      - bulk-update
      - bulk-delete
      - unrelate
      - add-reminder
      - remove-reminder
      # The projects module also carries write subcommands; the token's read-only scope is the second layer.
      - vikunja_projects.create
      - vikunja_projects.update
      - vikunja_projects.delete
      - vikunja_projects.archive
      - vikunja_projects.unarchive
      - vikunja_projects.move
      - vikunja_projects.duplicate
      - vikunja_projects.setup-kanban
      - vikunja_projects.*-share
      - vikunja_projects.share-*
      - vikunja_projects.*-bucket
      - vikunja_projects.*-view
      - vikunja_projects.*-project-user*
      - vikunja_projects.*-project-team*
    allowed_projects_ref: policy://vikunja-clerk/allowed-projects
    denied_projects_ref: policy://vikunja-clerk/denied-projects
    default_project_ref: policy://vikunja-clerk/inbox
    # Denied projects are never written; deny wins.
    denied_projects_never_written: true
    deny_wins: true
    unknown_or_unscoped_project: refuse
    create_without_named_project: inbox
    create_with_unresolved_project_name: inbox
    project_lookup: vikunja_projects.list
    search_open_tasks_before_create: true
    duplicate_create_is_refused: true
    write_targets_in_allowed_projects: true
    readback_after_write: true
    allowed_projects_environment_variable: VIKUNJA_ALLOWED_PROJECTS
    denied_projects_environment_variable: VIKUNJA_DENIED_PROJECTS
    inbox_project_environment_variable: VIKUNJA_INBOX_PROJECT_ID
    mode_environment_variable: VIKUNJA_MODE
    project_id_argument: projectId # Structured mandate field: project_id
    task_id_argument: id # Structured mandate field: task_id
    project_scope_enforced_in_code: true
    create_requires_project_id_in_allowed_projects: true
    update_requires_existing_task_project_in_allowed_projects: true
    update_project_id_must_match_existing_task: true
    update_project_id_change_enforced_in_code: true
    mode_enforced_in_code: true
    shadow_mode:
      dispatch_writes: false
      return_intended_call: true
    deny_unknown_tools_and_operations: true
    enforce_before_dispatch: true
    on_error: deny
dify:
  app: {description: 'Find, file, update, comment on, relate, close, and reopen Vikunja tasks through a guarded workflow.', icon: 🤖, icon_background: '#D5F5F6',
    mode: advanced-chat, name: __DIFY_AGENT_NAME__, use_icon_as_answer_icon: false}
  dependencies: []
  kind: app
  version: 0.1.5
  workflow:
    conversation_variables: []
    environment_variables:
    - {id: vikunja_allowed_projects, name: VIKUNJA_ALLOWED_PROJECTS, value_type: secret, value: '', description: 'JSON array
        resolved from policy://vikunja-clerk/allowed-projects'}
    - {id: vikunja_denied_projects, name: VIKUNJA_DENIED_PROJECTS, value_type: secret, value: '', description: 'JSON array
        resolved from policy://vikunja-clerk/denied-projects'}
    - {id: vikunja_inbox_project, name: VIKUNJA_INBOX_PROJECT_ID, value_type: secret, value: '', description: 'Runtime project
        ID resolved from policy://vikunja-clerk/inbox'}
    - {id: vikunja_mode, name: VIKUNJA_MODE, value_type: string, value: __DIFY_MODE__, description: Use shadow to preview
