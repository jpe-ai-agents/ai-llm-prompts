            mode: chat
            name: __DIFY_LITELLM_ROLE__
            provider: langgenius/openai_api_compatible/openai_api_compatible
          prompt_template:
          - id: user-prompt
            role: user
            text: |-
              __DIFY_PROMPT_GROUPING__

              Grouping input: {{#group_loop.item.prompt_payload#}}
              Themes proposed this run: {{#theme_loop.output#}}
          prompt_config: {jinja2_variables: []}
