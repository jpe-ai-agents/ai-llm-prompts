      - data:
          code: |-
            import json
            __DIFY_HELPER_JSON_FENCE__
            def valid_theme(value):
                if not isinstance(value,str): return ''
                value=' '.join(value.split())
                return value if 2<=len(value.split())<=5 and len(value)<=80 else ''
            def main(model_text:str,item:dict)->dict:
                bindings=item.get('bindings',[]) if isinstance(item,dict) else []
                theme=''; pairs=[]
                try:
                    intent=json.loads(strip_json_fence(model_text))
                    if isinstance(intent,dict):
                        theme=valid_theme(intent.get('theme'))
                        proposals=intent.get('pairs')
                        if isinstance(proposals,list):
                            for proposal in proposals:
                                if not isinstance(proposal,dict) or type(proposal.get('other')) is not int or proposal.get('label') not in ('duplicate','related','none'): continue
                                index=proposal['other']
                                if index<0 or index>=len(bindings): continue
                                candidate=bindings[index]
                                pairs.append({'id':str(item.get('id','')),'other':candidate['id'],'score':candidate['score'],'label':proposal['label']})
                except Exception: pass
                return {'result_json':json.dumps({'id':str(item.get('id','')),'theme':theme,'pairs':pairs,'error':str(item.get('error',''))},ensure_ascii=False)}
          code_language: python3
          desc: Bind model-selected indexes to code-owned task IDs and retrieval scores.
          isInIteration: true
          iteration_id: group_loop
          outputs:
            result_json: {type: string, children: null}
          selected: false
          title: Bind grouping result
          type: code
          variables:
          - variable: model_text
            value_selector: [group_model, text]
          - variable: item
            value_selector: [group_loop, item]
        height: 54
        id: group_bind
        parentId: group_loop
        extent: parent
        position: {x: 620, y: 60}
        positionAbsolute: {x: 3690, y: 90}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          code: |-
            import json
            def id_key(ref):
                value=str(ref.get('id',''))
                return (0,int(value)) if value.isdigit() else (1,value)
            def cursor(refs,timestamp,size_raw):
                size=int(size_raw)
                if size<1: raise ValueError('invalid batch size')
                ordered=sorted(refs,key=id_key)
                count=(len(ordered)+size-1)//size
                if not count: return ordered,0,0,size
                index=(int(float(timestamp))//600)%count
                return ordered[index*size:(index+1)*size],index,count,size
            def main(refs_text:str,model_tasks_text:str,timestamp:str,size_raw:str)->dict:
                try:
                    refs=json.loads(refs_text)
                    if not isinstance(refs,list): raise ValueError()
                    selected,index,count,size=cursor(refs,timestamp,size_raw)
                    selected_indices={ref['task_index'] for ref in selected}
                    model=json.loads(model_tasks_text)
                    if not isinstance(model,dict) or not isinstance(model.get('tasks'),list): raise ValueError()
                    safe_by_index={task.get('task_index'):task for task in model['tasks'] if isinstance(task,dict)}
                    def safe_ref(ref):
                        safe=dict(ref); task=safe_by_index.get(ref.get('task_index'),{})
                        safe.update({'title':str(task.get('title','')),'description':str(task.get('description',''))})
                        return safe
                    visible=[task for task in model['tasks'] if task.get('task_index') in selected_indices]
                    context=dict(model)
                    context.update({'batch_index':index,'batch_count':count,'batch_size':size,'tasks':visible})
                    return {'batch_refs':selected,'selected_group_refs':[safe_ref(ref) for ref in selected],'all_group_refs':[safe_ref(ref) for ref in refs],'model_tasks':json.dumps(context,ensure_ascii=False),'batch_index':index,'batch_count':count,'batch_size':size,'batch_error':''}
                except Exception:
                    return {'batch_refs':[],'selected_group_refs':[],'all_group_refs':[],'model_tasks':'{"tasks":[]}','batch_index':0,'batch_count':0,'batch_size':0,'batch_error':'batch cursor could not be computed'}
          code_language: python3
          outputs:
            batch_refs: {type: 'array[object]', children: null}
            selected_group_refs: {type: 'array[object]', children: null}
            all_group_refs: {type: 'array[object]', children: null}
            model_tasks: {type: string, children: null}
            batch_index: {type: number}
            batch_count: {type: number}
            batch_size: {type: number}
            batch_error: {type: string, children: null}
          selected: false
          title: Select task batch
          type: code
          variables:
          - variable: refs_text
            value_selector: [prepare, task_refs]
          - variable: model_tasks_text
            value_selector: [prepare, model_tasks]
          - variable: timestamp
            value_selector: [sys, timestamp]
          - variable: size_raw
            value_selector: [env, GROUPING_BATCH_SIZE]
        height: 54
        id: batch
        position: {x: 1550, y: 170}
        positionAbsolute: {x: 1550, y: 170}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          code: |-
            import concurrent.futures,json,math,time,urllib.parse,urllib.request
            from urllib.parse import urlsplit
            class NoRedirect(urllib.request.HTTPRedirectHandler):
                def redirect_request(self,req,fp,code,msg,headers,newurl): return None
            def entity_identity(item):
                return (str(item.get('id') or ''),str(item.get('name') or '')) if isinstance(item,dict) else ('','')
            def score_value(record,floor):
                value=record.get('score') if isinstance(record,dict) else None
                try: score=float(value)
                except Exception: return None
                return score if not isinstance(value,bool) and math.isfinite(score) and score>=floor else None
            def main(api_base,api_key,dataset_name,provider,model,batch_refs,selected_group_refs=None,all_group_refs=None,score_floor_raw='0.86',top_k_raw='5'):
                refs=[ref for ref in (batch_refs or []) if isinstance(ref,dict)]
                safe_refs=[ref for ref in (selected_group_refs if selected_group_refs is not None else refs) if isinstance(ref,dict)]
                all_refs=[ref for ref in (all_group_refs if all_group_refs is not None else safe_refs) if isinstance(ref,dict)]
                empty={'group_refs':[],'group_inputs':[],'theme_inputs':[],'grouping_error':'','pending_count':0}
                if not refs: return empty
                if not str(api_base or '').strip() or not str(api_key or '').strip():
                    empty['grouping_error']='Dify Dataset API is not configured'; return empty
                name=str(dataset_name or '').strip()
                if not name:
                    empty['grouping_error']='TRIAGE_DATASET_NAME is empty'; return empty
                try:
                    parts=urlsplit(str(api_base).strip())
                    if parts.scheme not in ('http','https') or not parts.netloc or parts.username or parts.password or parts.query or parts.fragment or not parts.path.rstrip('/').endswith('/v1'):
                        raise ValueError('invalid Dify Service API base')
                    base=parts.geturl().rstrip('/')
                    opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect())
                    def request_json(method,path,query=None,payload=None):
                        url=base+path+('?'+urllib.parse.urlencode(query) if query else '')
                        body=None if payload is None else json.dumps(payload,ensure_ascii=False).encode()
                        headers={'Authorization':'Bearer '+str(api_key),'Accept':'application/json'}
                        if body is not None: headers['Content-Type']='application/json'
                        req=urllib.request.Request(url,data=body,headers=headers,method=method)
                        try:
                            with opener.open(req,timeout=2) as response: return json.loads(response.read())
                        except Exception: raise ValueError('Dify Dataset API request failed') from None
                    def pages(path,keyword):
                        page=1
                        while True:
                            result=request_json('GET',path,{'page':page,'limit':100,'keyword':keyword})
                            rows=result.get('data') if isinstance(result,dict) else None
                            if not isinstance(rows,list): raise ValueError('Dify Dataset API returned an invalid list')
                            yield from rows
                            if not result.get('has_more'): break
                            page+=1
                    dataset_id=''
                    for candidate in pages('/datasets',name):
                        candidate_id,candidate_name=entity_identity(candidate)
                        if candidate_name==name and candidate_id:
                            dataset_id=candidate_id; break
                    if not dataset_id:
                        if not str(provider or '').strip() or not str(model or '').strip():
                            empty['grouping_error']='Embedding provider and model are required to create the grouping dataset'; return empty
                        created=request_json('POST','/datasets',payload={'name':name,'indexing_technique':'high_quality','embedding_model_provider':str(provider).strip(),'embedding_model':str(model).strip()})
                        dataset_id,dataset_name_returned=entity_identity(created)
                        if not dataset_id or dataset_name_returned!=name: raise ValueError('Dify Dataset API returned an invalid dataset')
                    batches=[]; failures=[]
                    for ref in refs:
                        task_id=str(ref.get('id',''))
                        if not task_id: failures.append('a task id was unavailable'); continue
                        document_name='vikunja:'+task_id
                        try:
                            document_id=''
                            path='/datasets/'+urllib.parse.quote(dataset_id,safe='')+'/documents'
                            for candidate in pages(path,document_name):
                                candidate_id,candidate_name=entity_identity(candidate)
                                if candidate_name==document_name and candidate_id:
                                    document_id=candidate_id; break
                            text=str(ref.get('title',''))+'\n\n'+str(ref.get('description',''))
                            if document_id:
                                result=request_json('POST',path+'/'+urllib.parse.quote(document_id,safe='')+'/update-by-text',payload={'name':document_name,'text':text})
                            else:
                                result=request_json('POST','/datasets/'+urllib.parse.quote(dataset_id,safe='')+'/document/create-by-text',payload={'name':document_name,'text':text})
                            batch_id=result.get('batch') if isinstance(result,dict) else None
                            if not isinstance(batch_id,str) or not batch_id: raise ValueError('Dify Dataset API returned no indexing batch')
                            batches.append(batch_id)
                        except Exception:
                            failures.append('one or more task documents could not be upserted')
                    pending=set(batches); deadline=time.monotonic()+4
                    for attempt in range(3):
                        for batch_id in list(pending):
                            if time.monotonic()>deadline: break
                            try:
                                status=request_json('GET','/datasets/'+urllib.parse.quote(dataset_id,safe='')+'/documents/'+urllib.parse.quote(batch_id,safe='')+'/indexing-status')
                                entries=status.get('data') if isinstance(status,dict) else None
                                if not isinstance(entries,list): continue
                                states=[str(entry.get('indexing_status','')) for entry in entries if isinstance(entry,dict)]
                                if states and all(state in ('completed','error','paused') for state in states): pending.discard(batch_id)
                            except Exception: pass
