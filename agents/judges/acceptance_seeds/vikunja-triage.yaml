# Seeds for the vikunja-triage acceptance set.
# Creates the required pre-run tasks and Ready-bucket fixtures.
- reset: TRIAGE_INBOX_PROJECT
- reset: TRIAGE_AREA_A_PROJECT
- reset: TRIAGE_AREA_B_PROJECT
- key: ready-01
  method: PUT
  path: /projects/${project:TRIAGE_AREA_A_PROJECT}/tasks
  json: {title: "ready cap seed ${RUN} 01", description: "Goal: Review service ownership. Scope: Check the first service record. Done-check: Its owner and review date are recorded.", priority: 2, done: false}
- key: ready-move-01
  method: POST
  path: /projects/${project:TRIAGE_AREA_A_PROJECT}/views/${view:TRIAGE_AREA_A_PROJECT}/buckets/${bucket:TRIAGE_AREA_A_PROJECT:Ready}/tasks
  json: {task_id: "${id:ready-01}"}
